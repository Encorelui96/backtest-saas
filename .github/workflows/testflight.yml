# Signs the iPhone app and sends it to TestFlight. Started by hand from the Actions tab.
# Secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID and ASC_PRIVATE_KEY (the .p8 file's text).
# The archive stays unsigned: at export, Xcode signs in the cloud with the API key, so no
# certificate has to live on the runner. altool then uploads the .ipa with the same key,
# because xcodebuild's own upload needs an Xcode account, which a runner doesn't have.
# The app must already exist in App Store Connect.
name: TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

jobs:
  upload:
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: node ../.github/scripts/check-asc-key.mjs
      - run: npm install
      - run: npx cap add ios
      - run: npx capacitor-assets generate --ios
      - run: npx cap sync ios
      # HTTPS only: nothing to declare for export, so TestFlight doesn't ask at each build.
      - run: /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist
      - name: Archive
        working-directory: mobile/ios/App
        run: >
          xcodebuild archive
          -project App.xcodeproj
          -scheme App
          -configuration Release
          -destination generic/platform=iOS
          -archivePath "$RUNNER_TEMP/App.xcarchive"
          MARKETING_VERSION=1.0
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          CODE_SIGNING_ALLOWED=NO
      - name: Sign
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          (umask 077 && printf '%s\n' "$ASC_PRIVATE_KEY" | tr -d '\r' > "$KEY_PATH")
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Upload
        run: >
          xcrun altool --upload-app --type ios
          --file "$(ls "$RUNNER_TEMP"/export/*.ipa)"
          --apiKey "$ASC_KEY_ID"
          --apiIssuer "$ASC_ISSUER_ID"
      # This log is public: only matching lines, without addresses or tokens.
      - name: Explain a failed export
        if: failure()
        run: |
          find "$(getconf DARWIN_USER_TEMP_DIR)" -path '*.xcdistributionlogs/*' -type f 2>/dev/null | while read -r log; do
            echo "== $(basename "$log")"
            grep -iE 'error|denied|forbidden|unauthori|no account|listTeams|cloud' "$log" | tail -40 | cut -c1-300 |
              sed -E 's/[[:alnum:]._%+-]+@[[:alnum:].-]+/[email]/g; s/eyJ[[:alnum:]._-]+/[token]/g'
          done
