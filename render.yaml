# Render Blueprint: Dashboard > New > Blueprint > this repository.
# Creates the website, the calculation worker and the Postgres database, in Frankfurt.
services:
  - type: web
    name: backtest-lab
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/me
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: backtest-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Your e-mail: once confirmed, it gets the Pro plan without paying and the admin page.
      - key: ADMIN_EMAILS
        sync: false
      # The same, by account id (shown on /compte): needed while no e-mail can be confirmed (no RESEND_API_KEY).
      - key: ADMIN_USER_IDS
        sync: false
      # Optional: AI translations a day for the whole site (200 by default), to cap the Anthropic bill.
      - key: AI_DAILY_CAP
        sync: false
      # Optional, can be added later in the service's Environment tab.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Telegram bot token from @BotFather: the alerts. Also on the worker.
      - key: TELEGRAM_BOT_TOKEN
        sync: false

  # Computes the queued backtests, apart from the website.
  - type: worker
    name: backtest-lab-worker
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: backtest-db
          property: connectionString
      # Same token as the web service: the worker reads the bot's messages and sends the alerts.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # The site's address, for the "Voir en direct" link in the alerts.
      - key: SITE_HOST
        fromService:
          name: backtest-lab
          type: web
          property: host

databases:
  - name: backtest-db
    plan: 0.1c-256mb
    region: frankfurt
    databaseName: backtest
    user: backtest
    postgresMajorVersion: "16"
